<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Open Mind Services Limited</title>
    <script>
      // GitHub Pages SPA redirect: https://github.com/rafgraph/spa-github-pages
      // Encodes the deep-linked path into a query string and redirects to the
      // app's index.html, which decodes it back before React Router mounts.
      var pathSegmentsToKeep = 1 // keep "/openmind360" as the base
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
